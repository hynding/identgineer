name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      # A build regenerates the committed component declarations; a difference means they are stale.
      - run: git diff --exit-code
      - run: pnpm audit --audit-level=high

  browser:
    runs-on: ubuntu-latest
    # The whole suite takes about 37 minutes on one runner, so it runs as two halves side by side,
    # each about 20 minutes. The limit leaves room for a slow runner: a tighter one once cancelled
    # runs that were passing.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @identgineer/components exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm --filter @identgineer/components test:browser --shard=${{ matrix.shard }}/2

  site-browser:
    runs-on: ubuntu-latest
    # A job of its own, so the components suite's two halves are not slowed. The sweep of every
    # design, layout and UX mode runs in three engines (Chromium, without calc-size() and without
    # container style queries), about nineteen minutes on two workers, so the suite runs as three
    # shards side by side, the longest about nine minutes after the build; the limit leaves room for
    # a slow runner.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @identgineer/site exec playwright install --with-deps chromium
      # The site and the workspace packages it is built from, and nothing else.
      - run: pnpm --filter "@identgineer/site..." build
      - run: pnpm --filter @identgineer/site test:browser --shard=${{ matrix.shard }}/3
