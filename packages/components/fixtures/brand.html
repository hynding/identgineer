<!doctype html>
<html lang="en" data-theme="aurora" data-design="flat" data-ux="comfortable">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>brand display fixture</title>
    <link rel="stylesheet" href="/tokens/index.css" />
    <link rel="stylesheet" href="/demo.css" />
    <link rel="stylesheet" href="/fixtures/brand.css" />
    <script type="module" src="/build/identgineer.esm.js"></script>
    <!-- The logos and themes are generated by the browser test and answered at /fixtures/brand-data.json. -->
    <script type="module" src="/fixtures/brand.js"></script>
  </head>
  <body>
    <main>
      <h1>Brand display</h1>

      <section id="logos" aria-labelledby="logos-title">
        <h2 id="logos-title">Logos</h2>
        <idg-brand-logo id="logo-lg" data-logo="harbour.logo" name="Harbour Lights" size="lg">
        </idg-brand-logo>
        <idg-brand-logo
          id="logo-mark"
          data-logo="harbour.mark"
          name="Harbour Lights"
          variant="mark"
        ></idg-brand-logo>
        <idg-brand-logo id="logo-xs" data-logo="harbour.logo" name="Harbour Lights" size="xs">
        </idg-brand-logo>
        <idg-brand-logo id="logo-sm" data-logo="harbour.logo" name="Harbour Lights" size="sm">
        </idg-brand-logo>
        <idg-brand-logo id="logo-md" data-logo="harbour.logo" name="Harbour Lights" size="md">
        </idg-brand-logo>
        <idg-brand-logo id="logo-xl" data-logo="harbour.logo" name="Harbour Lights" size="xl">
        </idg-brand-logo>
        <p>
          <idg-brand-logo
            id="logo-decorative"
            data-logo="harbour.logo"
            name="Harbour Lights"
            decorative
          >
          </idg-brand-logo>
          <span>Harbour Lights</span>
        </p>
      </section>

      <section id="fallbacks" aria-labelledby="fallbacks-title">
        <h2 id="fallbacks-title">Fallbacks</h2>
        <idg-brand-logo id="logo-hostile" data-logo="hostile.logo" name="Harbour Lights">
        </idg-brand-logo>
        <idg-brand-logo
          id="logo-hostile-mark"
          data-logo="hostile.logo"
          name="Harbour Lights"
          variant="mark"
        ></idg-brand-logo>
        <idg-brand-logo id="logo-wordmark" name="Acme Rockets" size="lg"></idg-brand-logo>
        <idg-brand-logo
          id="logo-monogram"
          name="Acme Rockets"
          variant="mark"
          size="lg"
        ></idg-brand-logo>
        <idg-brand-logo id="logo-empty"></idg-brand-logo>
      </section>

      <section id="colours" aria-labelledby="colours-title">
        <h2 id="colours-title">Colours</h2>
        <idg-brand-swatches
          id="swatches-harbour"
          data-theme-source="harbour"
          label="Harbour Lights colours"
        ></idg-brand-swatches>
        <idg-brand-swatches
          id="swatches-pale"
          data-theme-source="pale"
          label="Pale Paper colours"
        ></idg-brand-swatches>
        <idg-brand-swatches
          id="swatches-hostile"
          data-theme-source="hostile"
          label="Untrusted colours"
        ></idg-brand-swatches>
        <idg-brand-swatches id="swatches-empty" label="No colours"></idg-brand-swatches>
      </section>
      <section id="guides" aria-labelledby="guides-title">
        <h2 id="guides-title">Guidelines</h2>
        <idg-brand-guidelines
          id="guide-harbour"
          data-kit-source="harbour"
          data-theme-source="harbour"
          heading-level="3"
          label="Harbour Lights guidelines"
        ></idg-brand-guidelines>
        <idg-brand-guidelines
          id="guide-acme"
          data-kit-source="acme"
          data-theme-source="acme"
          heading-level="3"
          label="Acme Rockets guidelines"
        ></idg-brand-guidelines>
        <idg-brand-guidelines
          id="guide-hostile"
          data-kit-source="hostile"
          data-theme-source="hostile-guide"
          heading-level="3"
          label="Untrusted guidelines"
        ></idg-brand-guidelines>
        <idg-brand-guidelines
          id="guide-empty"
          heading-level="3"
          label="No guidelines"
        ></idg-brand-guidelines>
      </section>
    </main>
  </body>
</html>
