<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="96" height="32" viewBox="0 0 96 32">
  <title>Triple Ring</title>
  <desc>Three rings, each cut by the same mask, drawn from one definition.</desc>
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="white"/>
      <rect x="14" y="0" width="4" height="32" fill="black"/>
    </mask>
    <g id="ring">
      <circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="4" mask="url(#cut)"/>
    </g>
  </defs>
  <g color="#0EA5E9">
    <use xlink:href="#ring"/>
    <use xlink:href="#ring" x="32" style="color: #22C55E"/>
    <use href="#ring" x="64" color="rgb(234, 179, 8)"/>
  </g>
</svg>
